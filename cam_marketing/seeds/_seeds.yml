version: 2

seeds:
  - name: exchange_rates
    description: >
      Annual average exchange rates used to convert spend into EUR.
      units_per_eur = how many units of the currency buy 1 EUR
      (spend_eur = spend / units_per_eur). One row per currency per year.
      Only the currency-years present in the data are included; the not_null
      test on fct_ad_performance_daily.spend_eur fails if a rate is missing.
    config:
      column_types:
        currency_code: string
        rate_year: int
        units_per_eur: decimal(18, 6)
        rate_source: string
    columns:
      - name: currency_code
        data_tests: [not_null]
      - name: rate_year
        data_tests: [not_null]
      - name: units_per_eur
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [currency_code, rate_year]
