name: 'cam_marketing'
version: '1.0.0'

# Which connection profile (in profiles.yml) this project uses.
profile: 'cam_marketing'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Settings with a + apply to every model in that folder and its sub-folders.
# Schema names: in dev and CI, dbt adds the layer to your base schema
# (e.g. dbt_josephine_staging). In prod, the layer name is used on its own
# (e.g. staging). See macros/generate_schema_name.sql.
models:
  cam_marketing:
    staging:
      +materialized: view        # light clean-up, always fresh, no storage
      +schema: staging
    intermediate:
      +materialized: view        # joins only; read by marts
      +schema: intermediate
    marts:
      +materialized: table       # final tables analysts query, so stored for speed
      +schema: marts
      +persist_docs:             # copy descriptions into Unity Catalog
        relation: true
        columns: true

  # Elementary (data quality monitoring) stores its results in its own schema.
  elementary:
    +schema: elementary

seeds:
  cam_marketing:
    +schema: reference
