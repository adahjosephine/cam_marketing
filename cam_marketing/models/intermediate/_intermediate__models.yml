version: 2

models:
  - name: int_facebook_ad_performance
    description: Facebook stats with ad, ad group, campaign and account details. One row per ad per day.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [ad_id, ad_date]
    columns:
      - name: campaign_id
        description: Every stats row should find its campaign.
        data_tests: [not_null]
      - name: currency_code
        data_tests: [not_null]

  - name: int_snapchat_ad_performance
    description: >
      Snapchat stats summed across countries, with ad, ad group and campaign
      details. One row per ad per day.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [ad_id, ad_date]
    columns:
      - name: campaign_id
        description: Every stats row should find its campaign.
        data_tests: [not_null]
