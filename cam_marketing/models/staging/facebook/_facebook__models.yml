version: 2

models:
  - name: stg_facebook_ads_stats
    description: Facebook daily performance, typed and cleaned. One row per ad per day.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [ad_id, ad_date]
    columns:
      - name: ad_id
        description: Facebook ad ID, stored as text.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_facebook_ads')
                field: ad_id
      - name: account_id
        description: Facebook ad account ID.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_facebook_accounts')
                field: account_id
      - name: ad_date
        description: The day the performance was recorded.
        data_tests: [not_null]
      - name: ad_spend
        description: Spend in the account's currency (see stg_facebook_accounts).
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: ad_impressions
        description: Times the ad was shown. 0 where the source sent 'null'.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: ad_clicks
        description: Clicks on the ad. 0 where the source sent 'null'.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: is_impressions_reported
        description: False when the source sent 'null' and impressions were set to 0.
      - name: is_clicks_reported
        description: False when the source sent 'null' and clicks were set to 0.

  - name: stg_facebook_ads
    description: One row per Facebook ad, linking it to its ad group, campaign and account.
    columns:
      - name: ad_id
        data_tests: [unique, not_null]
      - name: ad_group_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_facebook_ad_groups')
                field: ad_group_id
      - name: campaign_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_facebook_campaigns')
                field: campaign_id
      - name: ad_status
        description: Current status of the ad, lower case.
        data_tests:
          - accepted_values:
              arguments:
                values: ['active', 'paused', 'archived', 'deleted']

  - name: stg_facebook_ad_groups
    description: One row per Facebook ad group.
    columns:
      - name: ad_group_id
        data_tests: [unique, not_null]

  - name: stg_facebook_campaigns
    description: One row per Facebook campaign.
    columns:
      - name: campaign_id
        data_tests: [unique, not_null]

  - name: stg_facebook_accounts
    description: One row per Facebook ad account, with its currency.
    columns:
      - name: account_id
        data_tests: [unique, not_null]
      - name: currency_code
        description: ISO currency code of the account's spend.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['EUR', 'USD']
