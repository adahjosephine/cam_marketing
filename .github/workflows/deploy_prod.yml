# Production deployment: runs when a pull request is merged into main
# (or manually from the Actions tab). Authenticates as the service
# principal, never as a person.
name: dbt production run

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  dbt-prod:
    runs-on: ubuntu-latest

    env:
      DBT_TARGET: prod
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python packages from uv.lock
        run: uv sync --locked

      - name: Install dbt packages
        working-directory: cam_marketing
        run: uv run dbt deps

      - name: Build and test in production
        working-directory: cam_marketing
        run: uv run dbt build

      - name: Generate documentation
        working-directory: cam_marketing
        run: uv run dbt docs generate

      - name: Save the documentation site
        uses: actions/upload-artifact@v4
        with:
          name: dbt-docs
          path: |
            cam_marketing/target/index.html
            cam_marketing/target/manifest.json
            cam_marketing/target/catalog.json
